; koldnet SD loader for 4 MB boards (SPEC-0003 #ota-design item 6, TASK-20261125-02). It lives in
; ota_1 ("flashApp", 640 KB) and replaces the upstream Wi-Fi loader. No radio, no Wi-Fi.
;   pio run -d koldnet-loader -e lora32-sd-loader
; A test build (throwaway key) adds PLATFORMIO_BUILD_FLAGS=-DKOLDNET_KOTA_TEST_KEY=1; no env sets it.
[env:lora32-sd-loader]
platform = platformio/espressif32@6.13.0
board = ttgo-lora32-v21
framework = arduino
board_build.partitions = ../partition-table.csv
board_upload.maximum_size = 655360
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I ../src
  -D KOLDNET_LOADER_BOARD_ID=2
  -D KOLDNET_LOADER_ENV=\"tlora-v2-1-1_6-tcxo\"
  -D CORE_DEBUG_LEVEL=0
build_src_filter =
  +<*>
  +<../../src/mesh/koldnet/KotaImage.cpp>
  +<../../src/mesh/koldnet/KotaLoader.cpp>
lib_deps =
  rweather/Crypto@0.4.0
monitor_speed = 115200
