[env:tlora-v2-1-1_6-tcxo]
extends = esp32_base
board_level = extra
board = ttgo-lora32-v21
build_flags = 
  ${esp32_base.build_flags}
  -D TLORA_V2_1_16
  -I variants/esp32/tlora_v2_1_16
  -D LORA_TCXO_GPIO=33
  -D KOLDNET_KOTA_SD=1 ; koldnet SPEC-0003 #ota-design item 6: KOTA stages on the microSD card (TASK-20261125-02)
upload_speed = 115200

; koldnet (TASK-20261124-02, SPEC-0002 D7): test build with the relay link filter. Never a release build.
[env:tlora-v2-1-1_6-tcxo-kt]
extends = env:tlora-v2-1-1_6-tcxo
build_flags =
  ${env:tlora-v2-1-1_6-tcxo.build_flags}
  -D KOLDNET_TEST_LINKS=1
