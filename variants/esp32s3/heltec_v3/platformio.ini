[env:heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec V3
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3

; koldnet (TASK-20261123-03): Heltec V3 as a Wi-Fi access point for the Luckfox
; proxy. network.wifi_ssid / wifi_psk are the AP's own credentials, set at run time.
[env:heltec-v3-koldnet-ap]
extends = env:heltec-v3
build_flags =
  ${env:heltec-v3.build_flags}
  -D KOLDNET_WIFI_AP=1

; koldnet (TASK-20261124-02, SPEC-0002 D7): test builds with the relay link filter.
; Never a release build: the filter exists only with KOLDNET_TEST_LINKS.
[env:heltec-v3-koldnet-test]
extends = env:heltec-v3
build_flags =
  ${env:heltec-v3.build_flags}
  -D KOLDNET_TEST_LINKS=1

[env:heltec-v3-koldnet-ap-test]
extends = env:heltec-v3
build_flags =
  ${env:heltec-v3.build_flags}
  -D KOLDNET_WIFI_AP=1
  -D KOLDNET_TEST_LINKS=1
